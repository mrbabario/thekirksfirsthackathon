<div class="flex min-h-screen items-center justify-center px-4">
  <hlm-card class="w-full max-w-md">
    <hlm-card-header>
      <h3 hlmCardTitle>Create an account</h3>
      <p hlmCardDescription>Enter your information below to create your account.</p>
    </hlm-card-header>

    <div hlmCardContent>
      <form id="create-account-form" class="flex flex-col gap-5" (ngSubmit)="onSubmit()">
        <div class="grid gap-2">
          <label hlmLabel for="name">Name</label>

          <input
            hlmInput
            id="name"
            type="text"
            name="name"
            placeholder="Your name"
            [(ngModel)]="name"
            required
          />
        </div>

        <div class="grid gap-2">
          <label hlmLabel for="email">Email</label>

          <input
            hlmInput
            id="email"
            type="email"
            name="email"
            placeholder="you@example.com"
            [(ngModel)]="email"
            required
          />
        </div>

        <div class="grid gap-2">
          <label hlmLabel for="password">Password</label>

          <input
            hlmInput
            id="password"
            type="password"
            name="password"
            placeholder="Create a password"
            [(ngModel)]="password"
            required
          />
        </div>

        <div class="grid gap-2">
          <label hlmLabel for="confirmPassword"> Confirm Password </label>

          <input
            hlmInput
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            placeholder="Confirm your password"
            [(ngModel)]="confirmPassword"
            required
          />
        </div>
      </form>
    </div>

    <hlm-card-footer class="flex-col gap-2">
      <button hlmBtn type="submit" form="create-account-form" class="w-full">Create Account</button>

      <a routerLink="/sign-in" class="text-center text-sm underline-offset-4 hover:underline">
        Already have an account? Sign in
      </a>

      <a
        routerLink="/"
        class="mt-3 text-center text-sm text-muted-foreground underline-offset-4 hover:underline"
      >
        Back to Home
      </a>
    </hlm-card-footer>
  </hlm-card>
</div>
