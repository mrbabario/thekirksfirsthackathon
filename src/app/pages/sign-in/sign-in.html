<div class="flex min-h-screen items-center justify-center px-4">
  <hlm-card class="w-full max-w-md">

    <hlm-card-header>
      <h3 hlmCardTitle>Sign In</h3>

      <p hlmCardDescription>
        Enter your email and password to sign in.
      </p>
    </hlm-card-header>


    <div hlmCardContent>

      <form
        id="sign-in-form"
        class="flex flex-col gap-5"
        (ngSubmit)="onSubmit()"
      >

        <div class="grid gap-2">
          <label hlmLabel for="email">
            Email
          </label>

          <input
            hlmInput
            id="email"
            type="email"
            name="email"
            placeholder="you@example.com"
            [(ngModel)]="email"
            required
          />
        </div>


        <div class="grid gap-2">
          <label hlmLabel for="password">
            Password
          </label>

          <input
            hlmInput
            id="password"
            type="password"
            name="password"
            placeholder="Enter your password"
            [(ngModel)]="password"
            required
          />
        </div>

      </form>

    </div>


    <hlm-card-footer class="flex-col gap-2">

      @if (errorMessage) {
        <p class="text-center text-sm text-red-500">
          {{ errorMessage }}
        </p>
      }

      <button
        hlmBtn
        type="submit"
        form="sign-in-form"
        class="w-full"
      >
        Sign In
      </button>


      <a
        routerLink="/create-account"
        class="text-center text-sm underline-offset-4 hover:underline"
      >
        Don't have an account? Create one
      </a>


      <a
        routerLink="/"
        class="mt-3 text-center text-sm text-muted-foreground underline-offset-4 hover:underline"
      >
        Back to Home
      </a>

    </hlm-card-footer>

  </hlm-card>
</div>
